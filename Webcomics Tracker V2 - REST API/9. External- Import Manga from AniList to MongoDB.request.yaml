$kind: http-request
name: "9. External: Import Manga from AniList to MongoDB"
url: "{{baseUrl}}/api/anilist/import/{{anilistId}}"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "status": "Plan to Read",
      "currentChapter": 0,
      "rating": 9.5
    }
order: 10000
